spring:
  # Datasource is provided at runtime by Testcontainers via @ServiceConnection (see TestcontainersConfiguration).
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  # Tests own their PostgreSQL through Testcontainers, so the docker-compose integration stays off.
  docker:
    compose:
      enabled: false

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN

# 31 February never comes: the sweep must never fire on its own in a test. Tests call sweep() directly.
komora:
  checkin:
    interval: 3d
    sweep-cron: "0 0 0 31 2 ?"
    removal-threshold: 3
