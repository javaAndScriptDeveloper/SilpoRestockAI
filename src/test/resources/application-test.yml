# A client id is pinned so no test ever performs Dynamic Client Registration against the real Silpo
# server: a greeting builds an authorization URL, and without this the tests that do not stub the OAuth
# server reach the live internet and fail whenever it is slow, down, or rate-limiting.
silpo:
  mcp:
    client-id: stub-client-id

spring:
  # Datasource is provided at runtime by Testcontainers via @ServiceConnection (see TestcontainersConfiguration).
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  # Tests own their PostgreSQL through Testcontainers, so the docker-compose integration stays off.
  docker:
    compose:
      enabled: false

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN

# 31 February never comes: the sweep must never fire on its own in a test. Tests call sweep() directly.
komora:
  checkin:
    interval: 3d
    sweep-cron: "0 0 0 31 2 ?"
    removal-threshold: 3

# Feign clients need a URL at startup even when the integration is off; the tests that use it point these
# at a stub instead. A blank client id keeps the calendar listener inert everywhere else.
google:
  calendar:
    token-endpoint: http://localhost:1/token
    api-url: http://localhost:1
