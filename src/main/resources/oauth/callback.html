<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Комора</title>
<style>
  :root {
    /* Verified in task 27 from every <path> fill of static.silpo.ua/content/Logotype.svg. Do not re-guess. */
    --silpo-primary: #FF8200;
    --silpo-primary-text: #ffffff;
    --neutral: #2E2E2E;
    --page: #f5f5f7;
    --surface: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #121214;
      --surface: #1c1c1e;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --neutral: #d4d4d4;
      --silpo-primary-text: #1a1a1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--page);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  .card {
    background: var(--surface);
    border-radius: 16px;
    padding: 32px 28px 28px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
  }
  .brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--silpo-primary);
    margin-bottom: 20px;
  }
  .glyph {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: {{accent}};
    color: var(--silpo-primary-text);
    font-size: 32px;
    line-height: 64px;
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 10px; }
  p { font-size: 15px; line-height: 1.5; margin: 0; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Комора</div>
  <div class="glyph">{{glyph}}</div>
  <h1>{{title}}</h1>
  <p>{{message}}</p>
</div>
</body>
</html>
