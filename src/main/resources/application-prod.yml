# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod (set on the `app` container in docker-compose.yml).
spring:
  datasource:
    hikari:
      # Fail fast rather than block callers when the pool is exhausted or the DB is unreachable.
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 1200000
      # Log a stack trace when a connection is held longer than this — catches leaks in prod.
      leak-detection-threshold: 30000

management:
  endpoints:
    web:
      exposure:
        # Trim the surface area in prod; drop what you don't scrape.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

# SpringDoc is enabled by default and says so in a WARN at every boot. On the deployed host (task 59) Caddy
# proxies this port, so /swagger-ui.html and /v3/api-docs would hand the entire internal API surface —
# /internal/metrics/pitch and the onboarding endpoints included — to anyone who finds the domain. Nothing
# consumes them in production; the local profiles keep both, so `make run` still serves Swagger.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.silporestockai: INFO
