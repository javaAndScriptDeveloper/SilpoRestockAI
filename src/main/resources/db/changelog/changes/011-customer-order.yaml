databaseChangeLog:
  - changeSet:
      id: 011-customer-order
      author: komora
      comment: >-
        An order the agent assembled. Named customer_order because ORDER is reserved in PostgreSQL and a
        quoted identifier would leak into every hand-written query written later. Payment is not modelled:
        the guest completes checkout on Silpo's own page, and there is no MCP payment tool.
      changes:
        - createTable:
            tableName: customer_order
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_customer_order
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_customer_order_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: items_json
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: delivery_slot
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: silpo_cart_id
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: confirmed_at
                  type: TIMESTAMP WITH TIME ZONE
        - createIndex:
            indexName: ix_customer_order_user_created
            tableName: customer_order
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
                  descending: true
