databaseChangeLog:
  - changeSet:
      id: 002-conversation-state
      author: komora
      comment: >-
        Per-chat conversation state. Telegram webhooks are stateless per request, so multi-step flows
        (onboarding, cart confirmation) resume from this row. Keyed by telegram_chat_id for now; task 05
        introduces the users table and the foreign key.
      changes:
        - createTable:
            tableName: conversation_state
            columns:
              - column:
                  name: telegram_chat_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_conversation_state
                    nullable: false
              - column:
                  name: current_flow
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: current_step
                  type: VARCHAR(64)
              - column:
                  name: context_json
                  type: JSONB
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
