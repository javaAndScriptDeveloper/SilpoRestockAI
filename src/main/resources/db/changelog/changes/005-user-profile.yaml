databaseChangeLog:
  - changeSet:
      id: 005-user-profile
      author: komora
      comment: >-
        Everything the agent knows about how a household eats. Collected partly from the Silpo profile over
        MCP and partly from onboarding questions, so most columns are nullable until they are learned.
      changes:
        - createTable:
            tableName: user_profile
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_profile
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: ux_user_profile_user_id
                    foreignKeyName: fk_user_profile_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: household_size
                  type: INT
              - column:
                  name: has_kids
                  type: BOOLEAN
              - column:
                  name: kids_ages
                  type: JSONB
              - column:
                  name: dietary_restrictions
                  type: JSONB
              - column:
                  name: weekly_budget
                  type: NUMERIC(10, 2)
              - column:
                  name: disliked_foods
                  type: JSONB
              - column:
                  name: only_ua_producer
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: special_mode
                  type: VARCHAR(64)
              - column:
                  name: special_mode_started_at
                  type: TIMESTAMP WITH TIME ZONE
