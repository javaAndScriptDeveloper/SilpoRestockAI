databaseChangeLog:
  - changeSet:
      id: 001-mcp-oauth-token
      author: komora
      comment: >-
        Server-side storage for Silpo MCP OAuth tokens. Token columns hold AES-GCM ciphertext, never plaintext.
        user_id is a plain unique column for now; task 05 introduces the users table and adds the foreign key.
      changes:
        - createTable:
            tableName: mcp_oauth_token
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_mcp_oauth_token
                    nullable: false
              - column:
                  name: access_token
                  type: VARCHAR(4096)
                  constraints:
                    nullable: false
              - column:
                  name: refresh_token
                  type: VARCHAR(4096)
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
