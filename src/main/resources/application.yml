spring:
  application:
    name: ${APP_NAME:silpo-restock-ai}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
    hikari:
      pool-name: app-cp
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Liquibase; Hibernate only validates it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  cache:
    type: caffeine
    # Declare the cache names up front so @Cacheable misses fail fast instead of creating caches lazily.
    cache-names: default
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
      circuitbreaker:
        # Wrap every Feign call in a Resilience4j circuit breaker; enables per-client fallbacks.
        enabled: true

  # spring-boot-docker-compose starts docker-compose.yml automatically on `bootRun`.
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # No security is wired in this template, so expose details directly. Switch to when-authorized once you add auth.
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

# Sensible defaults applied to every Resilience4j instance; Feign clients pick these up by client name.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
    instances:
      # Silpo rate-limits per guest and answers 429; back off exponentially rather than hammering it.
      # Only SilpoMcpRateLimitedException is retried — a 403 or a bad argument must fail on the first attempt.
      silpoMcp:
        base-config: default
        max-attempts: 4
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.silporestockai.exception.SilpoMcpRateLimitedException

# Official Silpo MCP server. Endpoints below match what the server advertises at
# /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource/mcp.
silpo:
  mcp:
    endpoint: ${SILPO_MCP_ENDPOINT:https://mcp.silpo.ua/mcp}
    issuer: ${SILPO_MCP_ISSUER:https://mcp.silpo.ua}
    # RFC 8707 resource indicator — the MCP endpoint URL itself, not the bare host.
    resource: ${SILPO_MCP_RESOURCE:https://mcp.silpo.ua/mcp}
    # Public OAuth client (token_endpoint_auth_method: none), so this is an identifier, not a secret.
    # Leave blank to self-register via RFC 7591 Dynamic Client Registration on first use.
    client-id: ${SILPO_MCP_CLIENT_ID:}
    client-name: ${SILPO_MCP_CLIENT_NAME:Komora}
    redirect-uri: ${SILPO_MCP_REDIRECT_URI:http://localhost:8080/auth/silpo/callback}
    request-timeout: ${SILPO_MCP_REQUEST_TIMEOUT:30s}
    login-state-ttl: ${SILPO_MCP_LOGIN_STATE_TTL:10m}
    # Base64-encoded 32-byte AES key encrypting stored tokens. Unset generates an ephemeral key at
    # startup, which means stored tokens do not survive a restart. Never commit a real key.
    token-encryption-key: ${SILPO_TOKEN_ENCRYPTION_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.silporestockai: DEBUG

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  # Public HTTPS URL of POST /telegram/webhook. Blank skips webhook registration at startup entirely.
  webhook-url: ${TELEGRAM_WEBHOOK_URL:}
  # Sent by Telegram as X-Telegram-Bot-Api-Secret-Token. Blank disables the check — local use only.
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  # Overridden by tests to point the SDK at a local stub. Not a production knob.
  api-url: ${TELEGRAM_API_URL:https://api.telegram.org}

claude:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:4096}
  # Meal plan generation is a long call; keep this well above a normal HTTP timeout.
  timeout: ${ANTHROPIC_TIMEOUT:120s}
  # Overridden by tests to point the SDK at a local stub. Not a production knob.
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
