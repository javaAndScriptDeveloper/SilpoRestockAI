# A throwaway Prometheus + Grafana, for verifying the real thing before the Grafana Cloud token exists (task 54).
#
# This is a verification harness, not infrastructure — deliberately its own file so `make up` can never start it.
# It proves three things the app alone cannot: that observability/alloy/config.alloy parses, that Alloy's scrape
# reaches an app running on the host, and that the committed dashboard JSON renders against real data. It proves
# nothing about Grafana Cloud itself; that is what the token step tests.
#
#   make observability-local-up     # then http://localhost:3000 (anonymous, already an Admin)
#   make observability-local-down
name: komora-observability-local

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: komora-prometheus
    command:
      # No scrape config of its own: Alloy pushes into it, exactly as it will push to Mimir.
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: komora-grafana
    depends_on:
      - prometheus
    environment:
      # A local throwaway with no data worth protecting; a login screen here would only slow a screenshot down.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      # The very same file that `make dashboard` pushes to Grafana Cloud. If it renders here, it renders there.
      - ../grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: komora-alloy-local
    depends_on:
      - prometheus
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../alloy/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      # Prometheus' remote-write receiver ignores basic auth, but non-empty values keep the config path identical
      # to the Grafana Cloud one — the point of this harness is to exercise that file, not a variant of it.
      GRAFANA_CLOUD_PROM_URL: http://prometheus:9090/api/v1/write
      GRAFANA_CLOUD_PROM_USER: local
      GRAFANA_CLOUD_PROM_TOKEN: local
      KOMORA_ENV: local
      APP_METRICS_TARGET: ${APP_METRICS_TARGET:-host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "12346:12345"
