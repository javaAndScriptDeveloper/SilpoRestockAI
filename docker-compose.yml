# Local infrastructure.
#
# - `db` starts by default. spring-boot-docker-compose manages it on `./gradlew bootRun`
#   and auto-configures the datasource, so you rarely start it by hand.
# - `app` runs the built image and is gated behind the `full` profile, so it is NOT started
#   by bootRun's docker-compose integration. Bring up the whole stack with `make up`
#   (see the Makefile) or: docker compose --env-file .env.example --profile full up --build
#
# Tests use their own throwaway PostgreSQL via Testcontainers — no service here for them.
services:
  db:
    image: postgres:17-alpine
    container_name: app-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    profiles: ["full"]
    build:
      context: .
    container_name: app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      APP_NAME: ${APP_NAME:-silpo-restock-ai}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      # Reach the database by its compose service name, not localhost.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-app}
      DB_USERNAME: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
    restart: unless-stopped

  # Grafana Alloy: scrapes /actuator/prometheus and remote-writes to Grafana Cloud (task 54).
  # Behind its own profile so bootRun's docker-compose integration never starts it — without a Grafana Cloud
  # token it would only crash-loop on every dev run. Start it with `make alloy-up`.
  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.10.0
    container_name: app-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_PROM_TOKEN: ${GRAFANA_CLOUD_PROM_TOKEN:-}
      KOMORA_ENV: ${KOMORA_ENV:-local}
      APP_METRICS_TARGET: ${APP_METRICS_TARGET:-host.docker.internal:8080}
    # Linux has no built-in host.docker.internal. This alias is what lets the container reach an app started
    # on the host by `make run` — the usual case, since the app is not in this compose file by default.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    restart: unless-stopped

volumes:
  db-data:
  alloy-data:
